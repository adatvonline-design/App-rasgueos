<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rasgueo·Lab · Guitarra</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600;0,9..144,600&display=swap" rel="stylesheet">
    <style>
      :root{
        --ink:#0b0f1a;
        --ink2:#161c2d;
        --line:#262d40;
        --accent:#5b8cff;
        --accent2:#8b5bff;
        --gold:#e9c46a;
        --txt:#e8ecf6;
        --muted:#8b93a9;
      }
      *{ font-family:'Inter',system-ui,sans-serif; }
      h1,h2,h3,.font-display{ font-family:'Sora','Inter',sans-serif; }
      body{ margin:0; background:var(--ink); color:var(--txt); }

      .app-bg{
        min-height:100vh;
        background:
          radial-gradient(1200px 600px at 12% -10%, rgba(91,140,255,.16), transparent 60%),
          radial-gradient(1000px 500px at 110% 10%, rgba(139,91,255,.14), transparent 55%),
          radial-gradient(900px 700px at 50% 120%, rgba(233,196,106,.06), transparent 60%),
          linear-gradient(180deg,#0a0e18 0%, #0b0f1a 40%, #0a0d16 100%);
      }
      .glass{
        background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
        border:1px solid rgba(255,255,255,.08);
        box-shadow:0 30px 80px -30px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.06);
        backdrop-filter:blur(14px);
      }
      .panel-sheet{
        background:
          linear-gradient(180deg,#fbfcff 0%, #f3f5fb 100%);
        box-shadow:0 40px 90px -35px rgba(8,12,28,.9), inset 0 1px 0 rgba(255,255,255,.9);
      }
      .btn{
        position:relative; border-radius:16px; font-weight:700; letter-spacing:.2px;
        transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .25s, filter .25s, background .25s;
        will-change:transform;
      }
      .btn:hover{ transform:translateY(-2px); }
      .btn:active{ transform:translateY(0) scale(.985); }
      .btn-grad{
        background:linear-gradient(135deg, var(--accent), var(--accent2));
        box-shadow:0 14px 30px -12px rgba(91,140,255,.7), inset 0 1px 0 rgba(255,255,255,.35);
      }
      .btn-grad:hover{ filter:brightness(1.08); box-shadow:0 20px 40px -12px rgba(139,91,255,.75), inset 0 1px 0 rgba(255,255,255,.4); }
      .btn-ghost{
        background:rgba(255,255,255,.04);
        border:1px solid rgba(255,255,255,.1);
      }
      .btn-ghost:hover{ background:rgba(255,255,255,.08); }
      .tool-btn{ transition:transform .18s cubic-bezier(.2,.8,.2,1), filter .2s, box-shadow .2s; }
      .tool-btn:hover{ filter:brightness(1.1); }
      .chip{
        border-radius:14px; border:1px solid rgba(255,255,255,.1);
        background:rgba(255,255,255,.03);
        transition:all .2s;
      }
      .chip-active{
        background:linear-gradient(135deg, var(--accent), var(--accent2));
        border-color:transparent;
        box-shadow:0 12px 26px -12px rgba(91,140,255,.8), inset 0 1px 0 rgba(255,255,255,.35);
      }
      .field{
        background:rgba(255,255,255,.04);
        border:1px solid rgba(255,255,255,.1);
        color:var(--txt);
        border-radius:14px;
        transition:border .2s, box-shadow .2s, background .2s;
      }
      .field:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(91,140,255,.18); background:rgba(255,255,255,.06); }
      .field::placeholder{ color:rgba(232,236,246,.35); }
      .eyebrow{ letter-spacing:.28em; text-transform:uppercase; font-size:11px; color:var(--muted); font-weight:700; }
      .glow-divider{ height:1px; background:linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent); }
      .badge-soft{ background:rgba(91,140,255,.12); border:1px solid rgba(91,140,255,.25); color:#bcd0ff; }
      .pulse-dot{ box-shadow:0 0 0 0 rgba(91,255,150,.7); animation:pulse 1.4s infinite; }
      @keyframes pulse{ 70%{ box-shadow:0 0 0 10px rgba(91,255,150,0);} 100%{ box-shadow:0 0 0 0 rgba(91,255,150,0);} }
      .toggle-track{ width:46px; height:26px; border-radius:999px; background:rgba(255,255,255,.12); transition:.25s; border:1px solid rgba(255,255,255,.12); }
      .toggle-track.on{ background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent; }
      .toggle-knob{ width:20px; height:20px; border-radius:999px; background:#fff; transition:.25s; box-shadow:0 2px 6px rgba(0,0,0,.4); }
      .toggle-track.on .toggle-knob{ transform:translateX(20px); }
      .arrow-cell{ transition:transform .22s cubic-bezier(.34,1.56,.64,1), filter .25s; }
      .arrow-cell:hover{ transform:translateY(-3px) scale(1.06); }
      .arrow-cell:active{ transform:translateY(0) scale(.94); }
      /* aparición al activar una flecha */
      @keyframes arrowPop{ 0%{ transform:scale(.55); opacity:0; } 60%{ transform:scale(1.12); opacity:1; } 100%{ transform:scale(1); opacity:1; } }
      .arrow-pop{ animation:arrowPop .34s cubic-bezier(.34,1.56,.64,1) both; }
      /* glow latente del cabezal activo */
      @keyframes arrowGlow{ 0%,100%{ opacity:.45; } 50%{ opacity:.9; } }
      .arrow-glow{ animation:arrowGlow 2.2s ease-in-out infinite; }
      /* pulso dorado mientras suena */
      @keyframes beatPulse{ 0%{ transform:scale(1); } 35%{ transform:scale(1.18); } 100%{ transform:scale(1); } }
      .arrow-beat{ animation:beatPulse .5s cubic-bezier(.34,1.56,.64,1); }
      /* flecha en curso (resaltado imperativo del metrónomo, sin re-render) */
      .arrow-current{ filter:drop-shadow(0 0 9px rgba(233,196,106,.95)) drop-shadow(0 0 3px rgba(233,196,106,.9)) saturate(1.3) brightness(1.18) !important; }
      .arrow-current svg{ filter:sepia(.6) saturate(3) hue-rotate(-18deg) brightness(1.12); }
      .fade-in{ animation:fadeIn .5s ease both; }
      @keyframes fadeIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }
      /* --- Overlay de precuenta --- */
      .countin-overlay{
        position:fixed; inset:0; z-index:60;
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
        background:rgba(8,11,20,.14);
        pointer-events:none;
      }
      .countin-number{
        font-family:'Sora','Inter',sans-serif; font-weight:800;
        font-size:clamp(120px, 34vw, 280px); line-height:1;
        background:linear-gradient(135deg,#bcd0ff,#cdb6ff 55%,#e9c46a);
        -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
        filter:drop-shadow(0 6px 22px rgba(11,15,26,.85)) drop-shadow(0 2px 6px rgba(11,15,26,.9));
        opacity:.92;
        animation:countPop .5s cubic-bezier(.2,.9,.3,1.2) both;
      }
      @keyframes countPop{
        0%{ transform:scale(.4); opacity:0; }
        45%{ transform:scale(1.08); opacity:.92; }
        100%{ transform:scale(1); opacity:.82; }
      }
      .countin-dots{ display:flex; gap:16px; }
      .countin-dot{
        width:15px; height:15px; border-radius:999px;
        background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.35);
        box-shadow:0 2px 8px rgba(11,15,26,.6);
        transition:all .25s;
      }
      .countin-dot.on{
        background:linear-gradient(135deg,#5b8cff,#8b5bff);
        border-color:transparent; transform:scale(1.18);
        box-shadow:0 0 16px rgba(91,140,255,.9), 0 2px 8px rgba(11,15,26,.6);
      }
      /* --- Responsive móvil: cada compás escalado para caber sin scroll horizontal --- */
      .bar-scale-wrap{ display:flex; justify-content:center; width:100%; }
      @media (max-width: 759px){
        .bar-scale-wrap{ transform-origin:center top; }
      }
      @media (max-width: 759px) and (min-width: 560px){
        .bar-scale-wrap{ transform:scale(1); }
      }
      @media (max-width: 559px) and (min-width: 440px){
        .bar-scale-wrap{ transform:scale(.82); margin:-8px 0; }
      }
      @media (max-width: 439px) and (min-width: 380px){
        .bar-scale-wrap{ transform:scale(.70); margin:-15px 0; }
      }
      @media (max-width: 379px){
        .bar-scale-wrap{ transform:scale(.60); margin:-20px 0; }
      }
      .level-card{ transition:transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .2s; }
      .level-card:hover{ transform:translateY(-3px); border-color:rgba(91,140,255,.4); box-shadow:0 30px 70px -30px rgba(91,140,255,.5), inset 0 1px 0 rgba(255,255,255,.08); }
      ::-webkit-scrollbar{ width:10px; height:10px; }
      ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:8px; }
    </style>
</head>

    <script id="presets-data" type="application/json">{"version":"1.0","capitulos":[{"id":1,"nivel":"gratis","titulo":"Antes del primer rasgueo","sub":"La mano que no se detiene"},{"id":2,"nivel":"gratis","titulo":"Tres patrones para empezar","sub":"Pop, rock y balada"},{"id":3,"nivel":"1","titulo":"Golpes y apagados","sub":"El rasgueo que también es batería"},{"id":4,"nivel":"1","titulo":"A contratiempo","sub":"Cumbia, reggae y ska"},{"id":5,"nivel":"1","titulo":"En tres","sub":"Vals y balada en 6/8"},{"id":6,"nivel":"2","titulo":"Bajo y rasgueo","sub":"Country, ranchera y bolero"},{"id":7,"nivel":"2","titulo":"Con la mano","sub":"Huapango, rumba y bossa nova"},{"id":8,"nivel":"2","titulo":"Semicorcheas y swing","sub":"Pop en 16vos, funk y shuffle"}],"patrones":[{"id":"E1","cap":1,"genero":"Ejercicio","nombre":"Negras hacia abajo","compas":"4/4","pulsos":4,"sub":2,"pendulo":true,"swing":false,"bpm":[60,80,100],"acordes":["G","C"],"compases":["D . D . D . D ."],"texto":["La mano baja en cada tiempo y sube sin tocar las cuerdas.","Lo que busco aquí no es el sonido, es el movimiento: el brazo va y viene como un péndulo, aunque solo toque de bajada."],"cuidar":"Que la subida sin tocar dure lo mismo que la bajada.","canciones":[]},{"id":"E2","cap":1,"genero":"Ejercicio","nombre":"Corcheas: abajo y arriba","compas":"4/4","pulsos":4,"sub":2,"pendulo":true,"swing":false,"bpm":[60,80,110],"acordes":["G","C"],"compases":["D U D U D U D U"],"texto":["Ahora toco también de subida. En el número la mano va hacia abajo y en la «y» va hacia arriba.","Es el mismo péndulo del ejercicio anterior, solo que las subidas ya suenan."],"cuidar":"La subida toca solo las cuerdas agudas. No hace falta llegar a la sexta.","canciones":[]},{"id":"E3","cap":1,"genero":"Ejercicio","nombre":"Acento en 2 y 4","compas":"4/4","pulsos":4,"sub":2,"pendulo":true,"swing":false,"bpm":[60,80,110],"acordes":["Am","F"],"compases":["D U >D U D U >D U"],"texto":["Las mismas corcheas, pero en el 2 y en el 4 toco más fuerte.","Es donde la batería pone la tarola, así que con el acento la guitarra ya suena acompañada."],"cuidar":"El acento sale de tocar más fuerte, no de acelerar.","canciones":[]},{"id":"E4","cap":1,"genero":"Ejercicio","nombre":"Semicorcheas","compas":"4/4","pulsos":4,"sub":4,"pendulo":true,"swing":false,"bpm":[50,60,80],"acordes":["Em"],"compases":["D U D U D U D U D U D U D U D U"],"texto":["Cuatro golpes por tiempo: to, ma, te, lo. La mano va al doble de velocidad y el número sigue cayendo de bajada.","Este ejercicio prepara el funk y el pop en semicorcheas del nivel 2."],"cuidar":"Empezar lento. Si el brazo se tensa, el tempo está muy alto.","canciones":[]},{"id":"P01","cap":2,"genero":"Pop y folk","nombre":"El de siempre","compas":"4/4","pulsos":4,"sub":2,"pendulo":true,"swing":false,"bpm":[70,96,120],"acordes":["G","D","Em","C"],"compases":["D . D U . U D U"],"texto":["Es el patrón que más se repite en la guitarra acústica: abajo, abajo-arriba, arriba-abajo-arriba.","El truco está en el 3: ahí la mano baja sin tocar, y eso hace que la subida del «3 y» se sienta adelantada."],"cuidar":"En el 3 la mano baja igual. Si se detiene, el patrón se desacomoda.","canciones":[{"c":"Riptide","a":"Vance Joy"},{"c":"I'm Yours","a":"Jason Mraz"},{"c":"Ho Hey","a":"The Lumineers"},{"c":"Como la flor","a":"Selena","nota":"con acento en las «y»"}]},{"id":"P02","cap":2,"genero":"Rock","nombre":"Corcheas hacia abajo","compas":"4/4","pulsos":4,"sub":2,"pendulo":false,"swing":false,"bpm":[100,140,176],"acordes":["A5","D5","E5"],"compases":["D D D D D D D D"],"texto":["Aquí todo es de bajada: ocho golpes por compás, todos hacia abajo.","Suena más pesado que abajo-arriba porque cada golpe entra con el mismo peso. Lo uso con quintas, o lo que es lo mismo, power chords."],"cuidar":"La muñeca hace el trabajo. El brazo casi no se mueve.","canciones":[{"c":"Blitzkrieg Bop","a":"Ramones"}]},{"id":"P03","cap":2,"genero":"Balada","nombre":"Abajo, abajo-arriba","compas":"4/4","pulsos":4,"sub":2,"pendulo":true,"swing":false,"bpm":[60,72,90],"acordes":["C","G","Am","F"],"compases":["D . D U D . D U"],"texto":["Un golpe largo en el 1 y un abajo-arriba en el 2. Luego se repite en el 3 y el 4.","Deja mucho aire entre golpes, por eso funciona en canciones lentas donde la voz necesita espacio."],"cuidar":"El golpe del 1 se deja sonar completo.","canciones":[{"c":"Let It Be","a":"The Beatles"},{"c":"Stand By Me","a":"Ben E. King"}]},{"id":"N1-01","cap":3,"genero":"Pop acústico","nombre":"Con golpe en 2 y 4","compas":"4/4","pulsos":4,"sub":2,"pendulo":true,"swing":false,"bpm":[80,100,120],"acordes":["C","Am","F","G"],"compases":["D . X U . U X U"],"texto":["Es «el de siempre» del capítulo 2, pero en el 2 y en el 4 el rasgueo se apaga.","¿Cómo lo hago? La mano baja y en el mismo movimiento la palma cae sobre las cuerdas. Suena un chasquido, como una tarola."],"cuidar":"El golpe es corto. La palma cae junto con el rasgueo, no después.","canciones":[{"c":"Better Together","a":"Jack Johnson"},{"c":"Proud Mary","a":"Creedence Clearwater Revival"}]},{"id":"N1-02","cap":3,"genero":"Rock","nombre":"Palm mute con acento","compas":"4/4","pulsos":4,"sub":2,"pendulo":false,"swing":false,"bpm":[100,140,176],"acordes":["E5","A5","B5"],"compases":[">D M M M >D M M M"],"texto":["Las mismas corcheas hacia abajo, ahora con la palma apoyada en el puente. Eso es el palm mute, o lo que es lo mismo, apagar con la palma.","En el 1 y en el 3 levanto la palma y el acorde suena abierto. El contraste entre abierto y apagado es lo que da la energía."],"cuidar":"La palma va sobre el puente. Si se recorre hacia el mástil, el acorde ya no suena.","canciones":[{"c":"Basket Case","a":"Green Day"}]},{"id":"N1-03a","cap":4,"genero":"Cumbia 1","nombre":"Chasquido y subida","compas":"2/4","pulsos":2,"sub":2,"pendulo":true,"swing":false,"bpm":[80,95,110],"acordes":["Am","G","C","E"],"compases":["X U . ."],"texto":["Cuento en dos: uno y dos y. En el 1 la mano baja apagada y suena el chasquido. En la «y» sube tocando el acorde abierto.","En el 2 la mano baja y sube sin tocar. Ese hueco es lo que deja respirar al patrón."],"cuidar":"En el 2 la mano sigue el péndulo aunque no toque. Si se detiene, la siguiente vuelta entra tarde.","canciones":[{"c":"Cómo te voy a olvidar","a":"Los Ángeles Azules"},{"c":"Llorar","a":"Los Socios del Ritmo"}]},{"id":"N1-03b","cap":4,"genero":"Cumbia 2","nombre":"Chasquido y subida, sin hueco","compas":"2/4","pulsos":2,"sub":2,"pendulo":true,"swing":false,"bpm":[80,95,110],"acordes":["Am","G","C","E"],"compases":["X U X U"],"texto":["Es la cumbia 1 con el hueco lleno: el chasquido y la subida se repiten en el 1 y en el 2.","El chasquido hace de tarola y la subida es el acorde. Con los dos alternados la mano ya no descansa."],"cuidar":"La subida suena abierta. Si se apaga igual que la bajada, todo se vuelve chasquido.","canciones":[{"c":"Cumbia sampuesana","a":"Aniceto Molina"}]},{"id":"N1-03c","cap":4,"genero":"Cumbia 3","nombre":"Con bajada y subida en medio","compas":"2/4","pulsos":2,"sub":4,"pendulo":true,"swing":false,"bpm":[70,85,100],"acordes":["Am","G","C","E"],"compases":["X . D U X . D ."],"texto":["Aquí la mano pasa a semicorcheas: uno ma te lo, dos ma te lo.","En cada número va el chasquido. En el primer tiempo le siguen una bajada y una subida abiertas; en el segundo, solo la bajada."],"cuidar":"Después de cada chasquido la mano sube sin tocar. Ese movimiento en el aire es el que deja la bajada en su lugar.","canciones":[]},{"id":"N1-04","cap":4,"genero":"Reggae","nombre":"El skank en 2 y 4","compas":"4/4","pulsos":4,"sub":2,"pendulo":true,"swing":false,"bpm":[60,72,84],"acordes":["A","D","E"],"compases":[". . D* . . . D* ."],"texto":["En el reggae la guitarra casi no toca: un golpe corto en el 2 y otro en el 4. Ese golpe se llama skank.","Toco solo las cuerdas agudas y apago el acorde enseguida, aflojando la mano izquierda. El bajo y la batería llenan el resto."],"cuidar":"Corto de verdad. Si el acorde se queda sonando, ya no es reggae.","canciones":[{"c":"Three Little Birds","a":"Bob Marley"},{"c":"Is This Love","a":"Bob Marley"},{"c":"La complicidad","a":"Cultura Profética"}]},{"id":"N1-05","cap":4,"genero":"Ska","nombre":"Arriba en cada «y»","compas":"4/4","pulsos":4,"sub":2,"pendulo":true,"swing":false,"bpm":[110,140,170],"acordes":["C","Am","F","G"],"compases":[". U* . U* . U* . U*"],"texto":["El ska es el pariente rápido del reggae. El golpe corto ya no cae en el 2 y el 4, cae en todas las «y».","La mano baja sin tocar en cada número y sube tocando en cada «y». Como en el reggae, cada subida se apaga enseguida."],"cuidar":"La bajada sin tocar mantiene el tiempo. Sin ella las subidas se adelantan.","canciones":[{"c":"La dosis perfecta","a":"Panteón Rococó"}]},{"id":"N1-06","cap":5,"genero":"Vals","nombre":"Tres golpes, acento en el 1","compas":"3/4","pulsos":3,"sub":1,"pendulo":false,"swing":false,"bpm":[80,100,132],"acordes":["C","G","F"],"compases":[">D D D"],"texto":["En 3/4 cuento uno, dos, tres. Toco hacia abajo en los tres y el 1 va más fuerte.","Con ese acento ya se entiende que es un vals, aunque los tres golpes sean iguales."],"cuidar":"El 2 y el 3 van más suaves que el 1, nunca más fuertes.","canciones":[{"c":"Piano Man","a":"Billy Joel"}]},{"id":"N1-07","cap":5,"genero":"Balada en 6/8","nombre":"Seis corcheas","compas":"6/8","pulsos":2,"sub":3,"pendulo":false,"swing":false,"bpm":[50,63,76],"acordes":["G","Em","C","D"],"compases":[">D D D >D D D"],"texto":["En 6/8 cuento seis corcheas y el pulso cae en el 1 y en el 4. Toco las seis hacia abajo y acentúo esas dos.","Se siente como un vals lento que se mece. El tempo de este patrón se cuenta en esos dos pulsos, no en las seis corcheas."],"cuidar":"Que el 4 se sienta como un segundo 1, más suave.","canciones":[{"c":"Perfect","a":"Ed Sheeran"},{"c":"Hallelujah","a":"Leonard Cohen"},{"c":"Todo cambió","a":"Camila"}]},{"id":"N2-01","cap":6,"genero":"Country","nombre":"Bajo y rasgueo","compas":"4/4","pulsos":4,"sub":2,"pendulo":true,"swing":false,"bpm":[90,110,140],"acordes":["G","C","D"],"compases":["B . D U b . D U"],"texto":["En el 1 toco solo la nota grave del acorde y en el 2 rasgueo abajo-arriba. En el 3 toco otra vez un bajo, ahora la quinta del acorde.","¿Cómo encuentro la quinta? En G el bajo es la sexta cuerda y la quinta es la cuerda de al lado, la cuarta al aire."],"cuidar":"El bajo suena solo. Si rozo otras cuerdas, se pierde el «bum».","canciones":[{"c":"Folsom Prison Blues","a":"Johnny Cash"},{"c":"I Walk the Line","a":"Johnny Cash"}]},{"id":"N2-02","cap":6,"genero":"Ranchera en 2/4","nombre":"Polka o corrido","compas":"2/4","pulsos":2,"sub":2,"pendulo":false,"swing":false,"bpm":[100,120,140],"acordes":["G","D7"],"compases":["B D b D"],"texto":["Es el «pun-cha, pun-cha» de la música norteña: un bajo en cada tiempo y el acorde en cada «y», siempre hacia abajo.","Alterno el bajo entre la raíz y la quinta, igual que en el country. Lo que cambia es el compás: aquí son dos tiempos."],"cuidar":"El rasgueo de la «y» es corto y seco, para que el bajo se oiga.","canciones":[{"c":"Contrabando y traición","a":"Los Tigres del Norte"}]},{"id":"N2-03","cap":6,"genero":"Ranchera valseada","nombre":"Bajo, rasgueo, rasgueo","compas":"3/4","pulsos":3,"sub":1,"pendulo":false,"swing":false,"bpm":[90,120,150],"acordes":["C","G7"],"compases":["B D D","b D D"],"texto":["El vals del nivel 1, ahora con bajo: en el 1 la nota grave y en el 2 y el 3 el acorde hacia abajo.","Son dos compases porque el bajo alterna: raíz en el primero y quinta en el segundo."],"cuidar":"El bajo del 1 dura todo el compás. No lo apago al rasguear.","canciones":[{"c":"Cielito lindo","a":"Quirino Mendoza y Cortés"},{"c":"El Rey","a":"José Alfredo Jiménez"}]},{"id":"N2-04","cap":6,"genero":"Bolero","nombre":"Bajo en 1 y 3, respuesta en la «y»","compas":"4/4","pulsos":4,"sub":2,"pendulo":true,"swing":false,"bpm":[66,76,88],"acordes":["Am","Dm","E7"],"compases":["B . . U b . . U"],"texto":["En el bolero el bajo marca el 1 y el 3. El acorde responde suave en la «y» del 2 y en la «y» del 4.","La mano sigue su péndulo: baja sin tocar en el 2 y en el 4, y toca de subida justo después."],"cuidar":"Las respuestas van suaves. Son la sombra del bajo, no el golpe principal.","canciones":[{"c":"Bésame mucho","a":"Consuelo Velázquez"},{"c":"Sabor a mí","a":"Álvaro Carrillo"},{"c":"Perfidia","a":"Alberto Domínguez"}]},{"id":"N2-05","cap":7,"genero":"Huapango","nombre":"Abanico y apagón","compas":"6/8","pulsos":2,"sub":3,"pendulo":false,"swing":false,"bpm":[56,66,80],"acordes":["A","E7","D"],"compases":["D F - X D U"],"texto":["En la corchea 1 bajo con tres dedos juntos y en la 2 abro el abanico: anular, medio e índice, uno tras otro, y lo dejo sonar dos corcheas.","En la 4 los dedos caen sobre las cuerdas y las apagan, el apagón. Cierro con un abajo-arriba en la 5 y la 6."],"cuidar":"El abanico se escucha nota por nota. Si suena como un solo golpe, los dedos están saliendo juntos.","canciones":[{"c":"Cucurrucucú paloma","a":"Tomás Méndez"},{"c":"La Malagueña","a":"Miguel Aceves Mejía"},{"c":"Serenata huasteca","a":"José Alfredo Jiménez"}]},{"id":"N2-06","cap":7,"genero":"Rumba flamenca","nombre":"El 3 en silencio","compas":"4/4","pulsos":4,"sub":2,"pendulo":true,"swing":false,"bpm":[90,110,130],"acordes":["Am","G","F","E"],"compases":["D U >D U . U >D U"],"texto":["Todas las bajadas tocan menos la del 3, y todas las subidas tocan. El 2 y el 4 van acentuados.","Aquí la plumilla no hace falta: medio y anular hacia abajo, la yema del pulgar hacia arriba. Con la mano en giro, como quien abre una perilla."],"cuidar":"En el 3 la mano baja igual, sin tocar.","canciones":[{"c":"Bamboléo","a":"Gipsy Kings"},{"c":"Entre dos aguas","a":"Paco de Lucía"}]},{"id":"N2-07","cap":7,"genero":"Bossa nova","nombre":"Pulgar y dedos","compas":"2/4","pulsos":2,"sub":4,"pendulo":false,"swing":false,"bpm":[60,70,84],"acordes":["Am7","D7"],"compases":["K . C . b C . ."],"texto":["El pulgar toca el bajo en cada tiempo: raíz en el 1 y quinta en el 2. Nunca se detiene.","Los dedos pinzan el acorde con el pulgar en el 1, solos en la «y» del 1, y luego en el «ma» del 2, una semicorchea después del pulgar."],"cuidar":"Primero el pulgar solo, hasta que camine sin pensarlo. Después entran los dedos.","canciones":[{"c":"Garota de Ipanema","a":"Antônio Carlos Jobim"},{"c":"Desafinado","a":"Antônio Carlos Jobim"},{"c":"Corcovado","a":"Antônio Carlos Jobim"}]},{"id":"N2-08","cap":8,"genero":"Pop en semicorcheas","nombre":"El de siempre, al doble","compas":"4/4","pulsos":4,"sub":4,"pendulo":true,"swing":false,"bpm":[70,87,100],"acordes":["Em7","G","Dsus4","A7sus4"],"compases":["D . D U . U D U D . D U . U D U"],"texto":["Tomo «el de siempre» del capítulo 2 y lo meto en medio compás. La mano ya va en semicorcheas, to-ma-te-lo, y el dibujo se repite dos veces.","Así es como se mueve la mano en canciones que suenan llenas sin ir rápido."],"cuidar":"La mano no deja de moverse en semicorcheas, aunque no toque.","canciones":[{"c":"Wonderwall","a":"Oasis","nota":"el movimiento continuo en semicorcheas"}]},{"id":"N2-09","cap":8,"genero":"Funk","nombre":"Rascado en 16vos","compas":"4/4","pulsos":4,"sub":4,"pendulo":true,"swing":false,"bpm":[80,96,110],"acordes":["E9"],"compases":[">D X X X X X >D X X >U X X X X X X"],"texto":["Todas las semicorcheas suenan, pero casi todas apagadas: la mano izquierda descansa sobre las cuerdas sin apretar. Eso es el chicken scratch, o el rascado.","Solo tres golpes dejan sonar el acorde: el 1, la «te» del 2 y el «ma» del 3. Aprieto el acorde justo en ese golpe y lo vuelvo a soltar."],"cuidar":"La derecha nunca cambia: siempre 16 golpes. La que decide qué suena es la izquierda.","canciones":[{"c":"Sex Machine","a":"James Brown","nota":"el estilo de rascado de Jimmy Nolen"},{"c":"Get Lucky","a":"Daft Punk con Nile Rodgers","nota":"semicorcheas cortas"}]},{"id":"N2-10","cap":8,"genero":"Shuffle","nombre":"Corcheas en swing","compas":"4/4","pulsos":4,"sub":2,"pendulo":true,"swing":true,"bpm":[100,120,150],"acordes":["E7","A7","B7"],"compases":["D U >D U D U >D U"],"texto":["Es el ejercicio de acento en 2 y 4 con un cambio: la «y» llega tarde. Cada tiempo se divide en tres y la subida cae en el tercero.","¿Qué significa eso? Que en vez de «1 y 2 y» se siente «1 –a 2 –a». Ese retraso es el swing."],"cuidar":"La subida espera. Si cae a la mitad del tiempo, es rock otra vez.","canciones":[{"c":"Pride and Joy","a":"Stevie Ray Vaughan"},{"c":"Rock Around the Clock","a":"Bill Haley & His Comets"}]}]}</script>

<script type="text/babel">
        const { useState, useRef, useEffect } = React;

        /* ---------- Iconos ---------- */
        const IcoPlay = ({size=18}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>);
        const IcoStop = ({size=18}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>);
        const IcoBack = ({size=18}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>);
        const IcoDice = ({size=18}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="16" cy="8" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="8" cy="16" r="1.4" fill="currentColor"/><circle cx="16" cy="16" r="1.4" fill="currentColor"/></svg>);
        const IcoBroom = ({size=18}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19.4 4.6l-8 8M14 9l1 1M3 21s2-5 6-6c2.5-.6 4-2 4-2l-2-2s-1.4 1.5-2 4c-1 4-6 6-6 6z"/></svg>);
        const IcoSave = ({size=18}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>);
        const IcoExport = ({size=18}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>);
        const IcoFolder = ({size=18}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>);
        const IcoLink = ({size=18}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>);
        const IcoGuitar = ({size=18}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 4l-2 2M18 6l-1.5-1.5M16.5 7.5L8 16a4 4 0 1 1-2-2l8.5-8.5"/><circle cx="7" cy="17" r="1"/></svg>);

        /* ---------- Capitaliza solo la primera letra ---------- */
        const capFirst = (s) => {
          if (!s) return '';
          return s.charAt(0).toUpperCase() + s.slice(1);
        };

        /* ---------- Pie de página ---------- */
        const Footer = () => (
          <footer style={{ width:'100%', maxWidth:'1040px', margin:'8px auto 0', textAlign:'center', padding:'10px 0 2px' }}>
            <a href="https://instagram.com/mercadoernesto" target="_blank" rel="noopener noreferrer"
              style={{ display:'inline-flex', alignItems:'center', gap:'8px', color:'var(--muted)', textDecoration:'none', fontSize:'13px', fontWeight:600, letterSpacing:'.02em', transition:'color .2s' }}
              onMouseEnter={(e)=>{ e.currentTarget.style.color='#bcd0ff'; }}
              onMouseLeave={(e)=>{ e.currentTarget.style.color='var(--muted)'; }}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5.5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
              </svg>
              @mercadoernesto
            </a>
          </footer>
        );

        /* ============================================================
           CONTROL DE ACCESO POR CONTRASEÑA (rotación bimestral automática)
           ------------------------------------------------------------
           - La contraseña válida cambia el día 1 de cada bimestre
             (ene, mar, may, jul, sep, nov).
           - Se deriva de una FRASE SECRETA + el período, con SHA-256,
             así nadie puede adivinar la del próximo bimestre leyendo el código.
           - Una vez validada, se guarda en el navegador hasta que caduque.
           ============================================================ */

        // 🔒 CAMBIA esta frase por una tuya, larga y privada. NO la compartas con nadie.
        //    (Es la "llave maestra" de la que se derivan todas las contraseñas.)
        const SECRET_PHRASE = "naumusiclab-2026-ernesto-mercado-funk-rasgueo-clave-secreta";

        /* ⚙️ BANDERAS DE FUNCIONES — para prender/apagar sin tocar el resto del código.
           SHOW_LOAD_CONFIG: muestra el botón "Cargar configuración guardada" en la pantalla
           de configuración. Apagado (false) para la versión publicada en GitHub Pages.
           Para volver a activarlo: cambiar a true. [2026-07-28] */
        const SHOW_LOAD_CONFIG = false;

        /* 🚪 PUERTA DE ENTRADA — cuál de los dos gates se usa.
           REQUIRE_PASSWORD: contraseña por bimestre (la de arriba). Apagada por ahora.
           REQUIRE_EMAIL: pide correo y lo manda a Formspree antes de dejar entrar.
           Poner las dos en false = app abierta sin ningún gate. [2026-07-28] */
        const REQUIRE_PASSWORD = false;
        const REQUIRE_EMAIL = true;
        const FORMSPREE_ENDPOINT = 'https://formspree.io/f/xojopljn';

        /* 🎁 LINK DIRECTO — `?d=1` salta la puerta.
           Para los links que se mandan a mano a alguien cuyo correo YA se tiene (alumnos,
           prospectos de WhatsApp, referidos): un formulario antes de dejar ver nada se lee
           como cobro, no como regalo. La URL sin el parametro conserva el gate para el
           trafico frio de Instagram (keyword RITMO), que es donde el correo si se gana.
           Regla: la puerta se elige por como llega la persona, no por cuanto captura. [2026-08-21] */
        const isDirectLink = () => {
          let direct = false;
          try { direct = new URLSearchParams(location.search).get('d') === '1'; } catch (e) {}
          try {
            if (direct) localStorage.setItem('emq_direct', '1');   // no se le vuelve a pedir en este navegador
            else direct = localStorage.getItem('emq_direct') === '1';
          } catch (e) {}   // modo privado: el parametro sigue sirviendo, solo no se recuerda
          return direct;
        };

        // Identificador del bimestre actual (p. ej. "2026-B1"). Cambia el día 1 cada 2 meses.
        const currentPeriodId = (d = new Date()) => {
          const y = d.getFullYear();
          const bimester = Math.floor(d.getMonth() / 2) + 1; // 1..6
          return `${y}-B${bimester}`;
        };

        // SHA-256 → hex
        const sha256Hex = async (str) => {
          const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        };

        // Contraseña legible del período: 3 bloques de 4 (p. ej. "7K3M-9QP2-4XT8")
        const passwordForPeriod = async (periodId) => {
          const hex = await sha256Hex(SECRET_PHRASE + '::' + periodId);
          const alphabet = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ'; // sin 0/O/1/I para evitar confusión
          let out = '';
          for (let i = 0; i < 12; i++) {
            const v = parseInt(hex.substr(i * 2, 2), 16);
            out += alphabet[v % alphabet.length];
            if (i === 3 || i === 7) out += '-';
          }
          return out; // "XXXX-XXXX-XXXX"
        };

        // Fecha en que caduca el bimestre actual (día 1 del siguiente bimestre)
        const periodExpiry = (d = new Date()) => {
          const y = d.getFullYear();
          const startMonth = Math.floor(d.getMonth() / 2) * 2; // 0,2,4,...
          const next = new Date(y, startMonth + 2, 1, 0, 0, 0, 0);
          return next;
        };

        const Gate = ({ children }) => {
          const [ok, setOk] = useState(false);
          const [checking, setChecking] = useState(true);
          const [input, setInput] = useState('');
          const [error, setError] = useState('');
          const [sending, setSending] = useState(false);
          const periodId = currentPeriodId();

          // al cargar: ¿ya tiene acceso guardado para el gate que esté activo?
          useEffect(() => {
            try {
              if (isDirectLink()) {
                setOk(true);          // link directo: sin puerta
              } else if (REQUIRE_PASSWORD) {
                const saved = localStorage.getItem('emq_access');
                if (saved && JSON.parse(saved).period === periodId) setOk(true);
              } else if (REQUIRE_EMAIL) {
                if (localStorage.getItem('emq_email')) setOk(true);
              } else {
                setOk(true);   // sin gate
              }
            } catch (e) {}
            setChecking(false);
          }, []);

          /* ---- gate de contraseña (apagado por ahora, se conserva completo) ---- */
          const submitPassword = async () => {
            const expected = await passwordForPeriod(periodId);
            const given = input.trim().toUpperCase().replace(/\s+/g, '');
            const norm = (s) => s.replace(/-/g, '');
            if (norm(given) === norm(expected)) {
              try { localStorage.setItem('emq_access', JSON.stringify({ period: periodId })); } catch (e) {}
              setOk(true); setError('');
            } else {
              setError('Contraseña incorrecta o vencida. Pide la del bimestre a @mercadoernesto.');
            }
          };

          /* ---- gate de correo → Formspree ---- */
          const submitEmail = async () => {
            const email = input.trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
              setError('Escribe un correo válido.');
              return;
            }
            setSending(true);
            try {
              await fetch(FORMSPREE_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ email, source: 'estudio-ritmico' })
              });
            } catch (e) {
              // si la red o Formspree fallan NO bloqueamos al alumno: se pierde el lead, no la clase
              console.error('No se pudo registrar el correo:', e);
            }
            try { localStorage.setItem('emq_email', JSON.stringify({ email, date: new Date().toISOString() })); } catch (e) {}
            setSending(false); setError(''); setOk(true);
          };

          const submit = REQUIRE_PASSWORD ? submitPassword : submitEmail;

          if (checking) return null;
          if (ok) return children;

          const exp = periodExpiry();
          const expStr = exp.toLocaleDateString('es-MX', { day:'numeric', month:'long', year:'numeric' });

          return (
            <div className="app-bg" style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'24px', gap:'18px', minHeight:'100vh' }}>
              <div className="glass fade-in" style={{ borderRadius:'28px', padding:'40px', width:'100%', maxWidth:'420px', textAlign:'center' }}>
                <div className="badge-soft" style={{ display:'inline-flex', alignItems:'center', gap:'8px', padding:'6px 14px', borderRadius:'999px', fontSize:'12px', fontWeight:700, marginBottom:'20px' }}>
                  <IcoGuitar size={14}/> ACCESO
                </div>
                <h1 style={{ fontSize:'30px', fontWeight:800, lineHeight:1.1, margin:'0 0 10px',
                  background:'linear-gradient(135deg,#bcd0ff,#cdb6ff)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent' }}>
                  Rasgueo·Lab
                </h1>
                <p style={{ color:'var(--muted)', fontSize:'14px', margin:'0 0 24px' }}>
                  {REQUIRE_PASSWORD
                    ? 'Introduce la contraseña del bimestre para entrar.'
                    : 'Déjame tu correo y entras.'}
                </p>
                <input type={REQUIRE_PASSWORD ? 'text' : 'email'} value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === 'Enter' && !sending) submit(); }}
                  placeholder={REQUIRE_PASSWORD ? 'XXXX-XXXX-XXXX' : 'tu@correo.com'}
                  autoFocus
                  autoComplete="email"
                  style={{ width:'100%', padding:'15px 16px', fontWeight:700,
                    fontSize: REQUIRE_PASSWORD ? '18px' : '16px',
                    letterSpacing: REQUIRE_PASSWORD ? '.08em' : 'normal',
                    textAlign:'center',
                    textTransform: REQUIRE_PASSWORD ? 'uppercase' : 'none',
                    borderRadius:'14px',
                    border:'1px solid rgba(255,255,255,.12)', background:'rgba(255,255,255,.05)', color:'var(--txt)', outline:'none' }} />
                {error && <p style={{ color:'#ff9aa6', fontSize:'13px', margin:'12px 0 0' }}>{error}</p>}
                <button onClick={submit} disabled={sending}
                  className="btn btn-grad" style={{ width:'100%', padding:'15px', color:'#fff', fontSize:'16px', marginTop:'18px', opacity: sending ? .6 : 1, cursor: sending ? 'wait' : 'pointer' }}>
                  {sending ? 'Un momento...' : 'Entrar'}
                </button>
                <p style={{ color:'var(--muted)', fontSize:'12px', margin:'18px 0 0' }}>
                  {REQUIRE_PASSWORD ? (
                    <>
                      Esta contraseña es válida hasta el {expStr}.<br/>
                      ¿No tienes acceso? Escríbeme a <a href="https://instagram.com/mercadoernesto" target="_blank" rel="noopener noreferrer" style={{ color:'#bcd0ff', textDecoration:'none' }}>@mercadoernesto</a>
                    </>
                  ) : (
                    <>
                      Sin spam. Te escribo solo cuando hay algo que vale la pena.<br/>
                      <a href="https://instagram.com/mercadoernesto" target="_blank" rel="noopener noreferrer" style={{ color:'#bcd0ff', textDecoration:'none' }}>@mercadoernesto</a>
                    </>
                  )}
                </p>
              </div>
            </div>
          );
        };

        /* ScaledBar vive FUERA de StrummingPatternApp a proposito: definido adentro,
           React lo trata como un componente distinto en cada render, lo desmonta y lo
           vuelve a montar, y con eso se pierde la escala medida y se desconecta el
           ResizeObserver. Ese era el bug de "se sale de los limites". [2026-07-28] */
        // Escala el contenido para que quepa en el ancho disponible (móvil), midiendo dinámicamente.
        // Funciona con cualquier número de flechas (8 o 16) sin depender de breakpoints fijos.
        const ScaledBar = ({ children }) => {
          const outerRef = useRef(null);
          const innerRef = useRef(null);
          const [scale, setScale] = useState(1);
          const [naturalH, setNaturalH] = useState(0);

          const fit = () => {
            if (!outerRef.current || !innerRef.current) return;
            const avail = outerRef.current.clientWidth;
            // scrollWidth/offsetHeight NO los afecta el transform: son medidas de layout,
            // así que siguen dando el tamaño natural aunque ya estemos escalando.
            const natural = innerRef.current.scrollWidth;
            const h = innerRef.current.offsetHeight;
            if (avail > 0 && natural > 0) {
              const s = Math.min(1, avail / natural);
              // el umbral evita re-renders infinitos: si el cambio es despreciable, no toca el estado
              setScale(prev => Math.abs(s - prev) < 0.002 ? prev : s);
              setNaturalH(prev => prev === h ? prev : h);
            }
          };

          /* Se re-mide DESPUÉS DE CADA RENDER, a propósito y sin lista de dependencias.
             Es lo único que cubre todos los casos en que cambia el tamaño del contenido:
             cambiar de nivel, de número de compases, agregar acordes, prender la cuenta,
             o pasar de layout de móvil a escritorio. Antes solo se medía al montar y en
             'resize', y ese listener corre ANTES de que React repinte el layout nuevo —
             por eso la escala se quedaba vieja y el contenido se salía de la hoja.
             No se usa ResizeObserver como mecanismo principal: sus callbacks dependen del
             ciclo de pintado y no disparan si la pestaña no está componiendo cuadros. */
          useEffect(() => { fit(); });

          useEffect(() => {
            const pending = [];
            /* Al redimensionar hay que medir DOS veces: una de inmediato y otra en diferido.
               El handler de 'resize' corre antes de que el navegador y React terminen de
               reacomodar el layout, así que la primera medición todavía ve el ancho viejo —
               ese era el caso en que el contenido se salía al cambiar el tamaño de ventana. */
            const refit = () => {
              fit();
              pending.push(setTimeout(fit, 80), setTimeout(fit, 250));
            };
            window.addEventListener('resize', refit);
            // re-medidas tras el montaje: fuentes web y layout que aún no ha asentado
            pending.push(setTimeout(fit, 60), setTimeout(fit, 300));
            return () => {
              window.removeEventListener('resize', refit);
              pending.forEach(clearTimeout);
            };
          }, []);
          return (
            <div ref={outerRef} style={{ width:'100%', display:'flex', justifyContent:'center', overflow:'hidden' }}>
              <div ref={innerRef} style={{ transform:`scale(${scale})`, transformOrigin:'center top',
                flexShrink:0,
                height: scale < 1 ? undefined : 'auto',
                // compensa el hueco que deja el escalado, con la altura real medida
                // (antes era una constante de 230px que no correspondía a todos los casos)
                marginBottom: scale < 1 ? `${-(1 - scale) * naturalH}px` : 0 }}>
                {children}
              </div>
            </div>
          );
        };

/* PRESETS-JSX:INICIO */
        /* ============================================================
           RITMOS DEL MÉTODO — los presets del Método de rasgueos
           ------------------------------------------------------------
           Fuente: tools/metodo_rasgueos_datos.json del vault (cerebro-wiki).
           Lo inyecta tools/construir_presets_app.py entre las marcas
           PRESETS-DATOS y PRESETS-JSX. No se edita a mano aquí: se edita el
           JSON o apps/app-rasgueos/presets.jsx del vault y se vuelve a construir.
           Mismas fichas y mismo dibujo que el PDF: D U . X M B b F C K - > *
           ============================================================ */
        const PRESETS = (() => {
          try { return JSON.parse(document.getElementById('presets-data').textContent); }
          catch (e) { return { capitulos: [], patrones: [] }; }
        })();

        const FICHA_RE = /^(>)?([DUXMBbFCK.\-])(\*)?$/;
        const leerFichas = (compas) => compas.trim().split(/\s+/).map((t) => {
          const m = FICHA_RE.exec(t) || [null, null, '.', null];
          return { acento: !!m[1], g: m[2], corto: !!m[3] };
        });

        /* ---------- Dibujo: el mismo de tools/metodo_rasgueos.py ---------- */
        const P_TINTA = '#141b2b', P_GRIS = '#5a6477', P_AIRE = '#b9c0cc', P_ACENTO = '#d9480f';
        const flechaSvg = (cx, abajo, relleno, color, y1 = 20, y2 = 72) => {
          const s = 2.1, h = 8.5;
          const pts = abajo
            ? [[cx - s, y1], [cx + s, y1], [cx + s, y2 - 12], [cx + h, y2 - 12], [cx, y2], [cx - h, y2 - 12], [cx - s, y2 - 12]]
            : [[cx - s, y2], [cx + s, y2], [cx + s, y1 + 12], [cx + h, y1 + 12], [cx, y1], [cx - h, y1 + 12], [cx - s, y1 + 12]];
          const d = 'M' + pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' L') + ' Z';
          return relleno ? `<path d="${d}" fill="${color}"/>`
            : `<path d="${d}" fill="${color}" opacity=".24"/>`; /* sin tocar: continua y tenue, como el PDF */
        };
        const simboloSvg = (f, cx, k, p, prevCx) => {
          const g = f.g; let o = '';
          const abajo = p.pendulo ? (k % 2 === 0) : true;
          if (f.acento) o += `<path d="M${cx - 6},5 L${cx + 6},10 L${cx - 6},15" fill="none" stroke="${P_ACENTO}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
          if (g === 'D') o += flechaSvg(cx, true, true, P_TINTA);
          else if (g === 'U') o += flechaSvg(cx, false, true, P_TINTA);
          else if (g === '.') { if (p.pendulo) o += flechaSvg(cx, abajo, false, P_TINTA); }
          else if (g === 'X') {
            o += flechaSvg(cx, abajo, false, P_TINTA);
            o += `<path d="M${cx - 7},39 L${cx + 7},53 M${cx + 7},39 L${cx - 7},53" stroke="${P_ACENTO}" stroke-width="2.4" stroke-linecap="round"/>`;
          } else if (g === 'M') {
            o += flechaSvg(cx, true, true, P_GRIS);
            if (!f.acento) o += `<text x="${cx}" y="14" text-anchor="middle" font-size="9" font-weight="600" fill="${P_GRIS}">pm</text>`;
          } else if (g === 'F') {
            [-6, 0, 6].forEach((dx, i) => {
              const yy = 20 + i * 6;
              o += `<path d="M${cx + dx},${yy} L${cx + dx},${yy + 36}" stroke="${P_TINTA}" stroke-width="1.6"/>`
                + `<path d="M${cx + dx - 3.5},${yy + 32} L${cx + dx},${yy + 39} L${cx + dx + 3.5},${yy + 32}" fill="${P_TINTA}"/>`;
            });
          } else if (g === 'C' || g === 'K') o += `<rect x="${cx - 7}" y="28" width="14" height="30" rx="4" fill="${P_TINTA}"/>`;
          else if (g === '-') {
            const x0 = prevCx != null ? prevCx + 9 : cx - 14;
            o += `<path d="M${x0},46 L${cx + 6},46" stroke="${P_TINTA}" stroke-width="2.2" stroke-linecap="round"/>`;
          }
          if (g === 'B' || g === 'b' || g === 'K') {
            const lleno = g !== 'b';
            o += `<circle cx="${cx}" cy="86" r="9" fill="${lleno ? P_TINTA : '#fff'}" stroke="${P_TINTA}" stroke-width="1.6"/>`
              + `<text x="${cx}" y="90.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="${lleno ? '#fff' : P_TINTA}">${g === 'b' ? '5' : '1'}</text>`;
          }
          if (f.corto) o += `<circle cx="${cx}" cy="80" r="2.6" fill="${P_TINTA}"/>`;
          return o;
        };
        const conteoDe = (p, k) => {
          const sub = p.sub, b = Math.floor(k / sub), s = k % sub;
          if (p.compas === '6/8') return [String(k + 1), true];
          if (sub === 1) return [String(b + 1), true];
          if (sub === 2) return s === 0 ? [String(b + 1), true] : ['y', false];
          return s === 0 ? [String(b + 1), true] : [['ma', 'te', 'lo'][s - 1], false];
        };
        /* Devuelve { svg, ancho, alto, centros } — centros[compás][paso] = x, para resaltar el golpe que suena */
        const gridSvg = (p, actual) => {
          const sub = p.sub, pulsos = p.pulsos;
          const w = { 1: 50, 2: 34, 3: 38, 4: 25 }[sub];
          const gb = 8, gbar = 26, pad = 14, n = pulsos * sub;
          const anchoC = n * w + (pulsos - 1) * gb;
          const W = pad * 2 + p.compases.length * anchoC + (p.compases.length - 1) * gbar, H = 118;
          let o = '', x = pad;
          p.compases.forEach((c, ci) => {
            const fs = leerFichas(c);
            o += `<path d="M${x - 7},20 L${x - 7},98" stroke="${ci === 0 ? P_TINTA : P_GRIS}" stroke-width="${ci === 0 ? 2.4 : 1.4}"/>`;
            let prev = null;
            fs.forEach((f, k) => {
              const b = Math.floor(k / sub), s = k % sub;
              const cx = x + b * gb + k * w + w / 2;
              if (s === 0 && b > 0) o += `<path d="M${cx - w / 2 - gb / 2},24 L${cx - w / 2 - gb / 2},94" stroke="#e3e6ec" stroke-width="1"/>`;
              if (actual && actual[0] === ci && actual[1] === k)
                o += `<rect x="${cx - w / 2 + 1}" y="2" width="${w - 2}" height="100" rx="6" fill="#ffe6d6"/>`;
              o += simboloSvg(f, cx, k, p, prev);
              const [lbl, fuerte] = conteoDe(p, k);
              o += `<text x="${cx}" y="114" text-anchor="middle" font-size="${fuerte ? 13 : 11}" font-weight="${fuerte ? 700 : 500}" fill="${fuerte ? P_TINTA : P_GRIS}">${lbl}</text>`;
              prev = cx;
            });
            x += anchoC + gbar;
          });
          const fin = x - gbar + 7;
          o += `<path d="M${fin},20 L${fin},98" stroke="${P_TINTA}" stroke-width="2.4"/><path d="M${fin - 5},20 L${fin - 5},98" stroke="${P_TINTA}" stroke-width="1"/>`
            + `<circle cx="${fin - 10}" cy="48" r="2" fill="${P_TINTA}"/><circle cx="${fin - 10}" cy="68" r="2" fill="${P_TINTA}"/>`;
          return { svg: `<svg viewBox="0 0 ${Math.round(W)} ${H}" width="${Math.round(W)}" height="${H}" font-family="Inter, Arial, sans-serif" style="display:block;max-width:none">${o}</svg>`, ancho: W };
        };

        /* ---------- Sonido: acorde de guitarra sintetizado ---------- */
        const NOTA_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
        const notasDe = (nombre) => {
          const m = /^([A-G])([#b♯♭]?)(.*)$/.exec(nombre || 'G') || ['', 'G', '', ''];
          const pc = (NOTA_PC[m[1]] + (/[#♯]/.test(m[2]) ? 1 : /[b♭]/.test(m[2]) ? -1 : 0) + 12) % 12;
          const q = m[3] || '';
          let iv;
          if (/^5/.test(q)) iv = [0, 7, 12];
          else if (/sus4/.test(q)) iv = /7/.test(q) ? [0, 7, 10, 17, 19] : [0, 7, 12, 17, 19];
          else if (/^m(?!aj)/.test(q)) iv = /7/.test(q) ? [0, 7, 10, 15, 19] : [0, 7, 12, 15, 19, 24];
          else if (/maj7/.test(q)) iv = [0, 7, 11, 16, 19];
          else if (/9/.test(q)) iv = [0, 7, 10, 14, 16];
          else if (/7/.test(q)) iv = [0, 7, 10, 16, 19];
          else iv = [0, 7, 12, 16, 19, 24];
          const raiz = 40 + ((pc - 4 + 12) % 12);           // de E2 a D#3
          return { acorde: iv.map((i) => raiz + i), raiz, quinta: raiz + 7 };
        };

        const PresetsLibrary = ({ onBack }) => {
          const pats = PRESETS.patrones || [];
          const caps = PRESETS.capitulos || [];
          const inicial = (() => {
            try { const id = new URLSearchParams(location.search).get('preset'); if (pats.some((p) => p.id === id)) return id; } catch (e) {}
            return pats[0] ? pats[0].id : null;
          })();
          const [sel, setSel] = useState(inicial);
          const p = pats.find((x) => x.id === sel) || pats[0];
          const [bpm, setBpm] = useState(p ? p.bpm[0] : 80);
          const [playing, setPlaying] = useState(false);
          const [actual, setActual] = useState(null);       // [compás, paso]
          const [acordeIdx, setAcordeIdx] = useState(0);
          const [cuenta, setCuenta] = useState(0);
          const [conClick, setConClick] = useState(true);
          const [conGuitarra, setConGuitarra] = useState(true);
          const ctxRef = useRef(null), runRef = useRef(null), bpmRef = useRef(bpm);
          const clickRef = useRef(conClick), guitRef = useRef(conGuitarra);
          useEffect(() => { bpmRef.current = bpm; }, [bpm]);
          useEffect(() => { clickRef.current = conClick; }, [conClick]);
          useEffect(() => { guitRef.current = conGuitarra; }, [conGuitarra]);
          useEffect(() => () => detener(), []);
          const cambiar = (id) => {
            detener();
            const q = pats.find((x) => x.id === id);
            setSel(id); if (q) setBpm(q.bpm[0]);
            try { const u = new URL(location.href); u.searchParams.set('preset', id); history.replaceState(null, '', u); } catch (e) {}
            setTimeout(() => { const el = document.getElementById('preset-player'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30);
          };

          const salida = (ctx) => {
            if (!ctx._sal) { const g = ctx.createGain(); g.gain.value = 0.9; g.connect(ctx.destination); ctx._sal = g; }
            return ctx._sal;
          };
          const cuerda = (ctx, t, midi, g, dur, brillo = 7) => {
            const f = 440 * Math.pow(2, (midi - 69) / 12);
            const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
            const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
            lp.frequency.setValueAtTime(Math.min(9000, f * brillo), t);
            lp.frequency.exponentialRampToValueAtTime(Math.max(180, f * 1.2), t + dur);
            const v = ctx.createGain();
            v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(g, t + 0.004);
            v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(lp); lp.connect(v); v.connect(salida(ctx)); o.start(t); o.stop(t + dur + 0.03);
          };
          const ruido = (ctx, t, g, dur, fc) => {
            const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
            const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            const src = ctx.createBufferSource(); src.buffer = buf;
            const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = fc; bp.Q.value = 0.9;
            const v = ctx.createGain(); v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.001, t + dur);
            src.connect(bp); bp.connect(v); v.connect(salida(ctx)); src.start(t); src.stop(t + dur);
          };
          const clic = (ctx, t, fuerte) => {
            const o = ctx.createOscillator(), v = ctx.createGain(); o.type = 'square';
            o.frequency.value = fuerte ? 1260 : 880;
            v.gain.setValueAtTime(fuerte ? 0.16 : 0.09, t); v.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
            o.connect(v); v.connect(salida(ctx)); o.start(t); o.stop(t + 0.06);
          };
          const golpe = (ctx, t, f, k, q, nombre, pasoDur) => {
            const { acorde, raiz, quinta } = notasDe(nombre);
            const abajo = q.pendulo ? (k % 2 === 0) : true;
            const vol = f.acento ? 1.45 : 1;
            const largo = f.corto ? 0.09 : Math.max(0.25, Math.min(1.4, pasoDur * 6));
            const rasgar = (notas, sep, g, dur, brillo) => notas.forEach((m, i) => cuerda(ctx, t + i * sep, m, g, dur, brillo));
            switch (f.g) {
              case 'D': rasgar(acorde, 0.011, 0.07 * vol, largo); break;
              case 'U': rasgar(acorde.slice(-4).reverse(), 0.009, 0.055 * vol, largo); break;
              case 'X': ruido(ctx, t, 0.35 * vol, 0.045, 2400); rasgar((abajo ? acorde : acorde.slice().reverse()).slice(0, 4), 0.006, 0.02, 0.04, 3); break;
              case 'M': rasgar(acorde.slice(0, 3), 0.008, 0.08 * vol, 0.11, 3); break;
              case 'B': cuerda(ctx, t, raiz, 0.16 * vol, largo * 1.2, 5); break;
              case 'b': cuerda(ctx, t, quinta, 0.15 * vol, largo * 1.2, 5); break;
              case 'C': rasgar(acorde.slice(-3), 0.002, 0.07 * vol, f.corto ? 0.09 : 0.5, 4); break;
              case 'K': cuerda(ctx, t, raiz, 0.16, 0.7, 5); rasgar(acorde.slice(-3), 0.002, 0.07 * vol, 0.5, 4); break;
              case 'F': [0, 0.035, 0.07].forEach((dt) => acorde.forEach((m, i) => cuerda(ctx, t + dt + i * 0.006, m, 0.045 * vol, largo, 6))); break;
              default: break;
            }
          };

          const detener = () => {
            const r = runRef.current;
            if (r) { r.stop = true; clearInterval(r.timer); r.timeouts.forEach(clearTimeout); }
            runRef.current = null; setPlaying(false); setActual(null); setCuenta(0);
          };
          const tocar = () => {
            if (!p) return;
            if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
            const ctx = ctxRef.current; if (ctx.state === 'suspended') ctx.resume();
            const q = p, fichasC = q.compases.map(leerFichas);
            const n = q.pulsos * q.sub;
            const run = { stop: false, timeouts: [], timer: null };
            runRef.current = run; setPlaying(true);
            const pulso = () => 60 / bpmRef.current;
            let t = ctx.currentTime + 0.12;
            for (let i = 0; i < q.pulsos; i++) {           // un compás de cuenta
              clic(ctx, t, i === 0);
              const ms = (t - ctx.currentTime) * 1000;
              run.timeouts.push(setTimeout(() => !run.stop && setCuenta(i + 1), Math.max(0, ms)));
              t += pulso();
            }
            run.timeouts.push(setTimeout(() => !run.stop && setCuenta(0), Math.max(0, (t - ctx.currentTime) * 1000)));
            let paso = 0, inicioPulso = t;
            const agenda = () => {
              while (!run.stop && t < ctx.currentTime + 0.12) {
                const glob = Math.floor(paso / n), ci = glob % q.compases.length, k = paso % n;
                const b = Math.floor(k / q.sub), s = k % q.sub;
                if (s === 0) inicioPulso = t;
                const pd = pulso() / q.sub;
                if (s === 0 && clickRef.current) clic(ctx, t, b === 0);
                const nombre = q.acordes[glob % q.acordes.length];
                if (guitRef.current) golpe(ctx, t, fichasC[ci][k], k, q, nombre, pd);
                const ms = (t - ctx.currentTime) * 1000;
                const marca = [ci, k], ai = glob % q.acordes.length;
                run.timeouts.push(setTimeout(() => { if (!run.stop) { setActual(marca); setAcordeIdx(ai); } }, Math.max(0, ms)));
                paso++;
                const k2 = paso % n, s2 = k2 % q.sub;
                if (s2 === 0) t = inicioPulso + pulso();
                else if (q.swing && q.sub === 2) t = inicioPulso + pulso() * (2 / 3);
                else t = inicioPulso + pd * s2;
              }
              if (run.timeouts.length > 400) run.timeouts.splice(0, 200);
            };
            run.timer = setInterval(agenda, 25); agenda();
          };

          if (!p) return (<div className="app-bg" style={{ padding: '40px', textAlign: 'center' }}>Sin presets.</div>);
          const nivelDe = (c) => { const cap = caps.find((x) => x.id === c); return cap ? cap.nivel : ''; };
          const etiquetaNivel = (nv) => nv === 'gratis' ? 'GRATIS' : `NIVEL ${nv}`;
          const g = gridSvg(p, actual);
          const minB = Math.max(30, p.bpm[0] - 20), maxB = Math.min(240, p.bpm[2] + 30);
          return (
            <div className="app-bg" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '20px 16px 28px', gap: '16px' }}>
              <div className="fade-in" style={{ width: '100%', maxWidth: '920px', minWidth: 0 }}>
                <button onClick={() => { detener(); onBack(); }} className="btn btn-ghost" style={{ display: 'inline-flex', alignItems: 'center', gap: '8px', padding: '9px 14px', borderRadius: '12px', fontSize: '13px', fontWeight: 700, marginBottom: '14px' }}>
                  <IcoBack /> Menú
                </button>
                <div style={{ textAlign: 'center', marginBottom: '18px' }}>
                  <div className="badge-soft" style={{ display: 'inline-flex', alignItems: 'center', gap: '8px', padding: '6px 14px', borderRadius: '999px', fontSize: '12px', fontWeight: 700, marginBottom: '12px' }}>
                    <IcoGuitar size={14} /> RITMOS DEL MÉTODO
                  </div>
                  <h1 style={{ fontSize: '34px', fontWeight: 800, lineHeight: 1.08, margin: '0 0 6px', background: 'linear-gradient(135deg,#ffd7bf,#e9c46a)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                    Rasgueos en la guitarra
                  </h1>
                  <p style={{ color: 'var(--muted)', fontSize: '14px', margin: 0 }}>Los mismos patrones del libro, con el mismo número, para tocarlos con metrónomo.</p>
                </div>

                <div id="preset-player" className="glass" style={{ borderRadius: '22px', padding: '18px', marginBottom: '18px', scrollMarginTop: '12px', minWidth: 0, overflow: 'hidden' }}>
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: '10px', flexWrap: 'wrap', marginBottom: '10px' }}>
                    <span style={{ background: '#d9480f', color: '#fff', fontWeight: 800, fontSize: '12px', letterSpacing: '.08em', borderRadius: '6px', padding: '3px 8px' }}>{p.id}</span>
                    <span className="eyebrow">{p.genero}</span>
                    <span style={{ fontFamily: 'Sora,Inter', fontSize: '22px', fontWeight: 800 }}>{p.nombre}</span>
                    <span style={{ marginLeft: 'auto', color: 'var(--muted)', fontSize: '13px', whiteSpace: 'nowrap' }}>{p.compas}{p.swing ? ' · swing' : ''} · tempo {p.bpm[0]} a {p.bpm[2]}</span>
                  </div>
                  <div style={{ background: '#fff', borderRadius: '14px', padding: '12px 10px 6px', overflowX: 'auto', position: 'relative', maxWidth: '100%', WebkitOverflowScrolling: 'touch' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', padding: '0 6px 4px', color: '#141b2b', fontFamily: 'Sora,Inter', fontWeight: 800, fontSize: '18px' }}>
                      <span>{p.acordes[acordeIdx % p.acordes.length]}</span>
                      {cuenta > 0 && <span style={{ color: '#d9480f', fontSize: '22px' }}>{cuenta}</span>}
                    </div>
                    <div style={{ width: `${Math.round(g.ancho)}px`, margin: '0 auto' }} dangerouslySetInnerHTML={{ __html: g.svg }} />
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '10px', marginTop: '14px' }}>
                    <button onClick={() => (playing ? detener() : tocar())} className={`btn ${playing ? 'btn-ghost' : 'btn-grad'}`}
                      style={{ display: 'inline-flex', alignItems: 'center', gap: '8px', padding: '12px 20px', borderRadius: '14px', fontWeight: 800, fontSize: '15px' }}>
                      {playing ? (<><IcoStop /> Detener</>) : (<><IcoPlay /> Tocar</>)}
                    </button>
                    <button onClick={() => setBpm((b) => Math.max(minB, b - 4))} className="chip" style={{ padding: '10px 12px', borderRadius: '12px', fontWeight: 800 }}>−4</button>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flex: '1 1 160px', minWidth: '150px' }}>
                      <input type="range" min={minB} max={maxB} value={bpm} onChange={(e) => setBpm(parseInt(e.target.value, 10))} style={{ flex: 1 }} aria-label="Tempo" />
                      <span style={{ fontWeight: 800, minWidth: '64px', textAlign: 'right' }}>{bpm} <span style={{ color: 'var(--muted)', fontSize: '12px' }}>BPM</span></span>
                    </div>
                    <button onClick={() => setBpm((b) => Math.min(maxB, b + 4))} className="chip" style={{ padding: '10px 12px', borderRadius: '12px', fontWeight: 800 }}>+4</button>
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px', marginTop: '10px' }}>
                    <button onClick={() => setConClick((v) => !v)} className={`chip ${conClick ? 'chip-active' : ''}`} style={{ padding: '8px 12px', borderRadius: '10px', fontSize: '13px', fontWeight: 700 }}>Metrónomo {conClick ? 'sí' : 'no'}</button>
                    <button onClick={() => setConGuitarra((v) => !v)} className={`chip ${conGuitarra ? 'chip-active' : ''}`} style={{ padding: '8px 12px', borderRadius: '10px', fontSize: '13px', fontWeight: 700 }}>Guitarra {conGuitarra ? 'sí' : 'no'}</button>
                    {[p.bpm[0], p.bpm[1], p.bpm[2]].map((v, i) => (
                      <button key={i} onClick={() => setBpm(v)} className="chip" style={{ padding: '8px 12px', borderRadius: '10px', fontSize: '13px', fontWeight: 700 }}>{['Lento', 'Medio', 'Meta'][i]} · {v}</button>
                    ))}
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(240px,1fr))', gap: '14px', marginTop: '14px', fontSize: '14px', lineHeight: 1.5 }}>
                    <div>
                      {p.texto.map((t, i) => (<p key={i} style={{ margin: '0 0 6px', color: 'var(--txt)' }}>{t}</p>))}
                      <p style={{ margin: '6px 0 0', color: '#ffd7bf', borderLeft: '3px solid #d9480f', paddingLeft: '8px' }}><b>Cuidar:</b> {p.cuidar}</p>
                    </div>
                    <div>
                      <div className="eyebrow" style={{ marginBottom: '6px' }}>Acordes para practicar</div>
                      <p style={{ margin: '0 0 10px', fontWeight: 700 }}>{p.acordes.join(' – ')}</p>
                      {p.canciones.length > 0 && (<>
                        <div className="eyebrow" style={{ marginBottom: '6px' }}>Dónde suena</div>
                        {p.canciones.map((c, i) => (<p key={i} style={{ margin: '0 0 3px' }}><b>{c.c}</b> <span style={{ color: 'var(--muted)' }}>· {c.a}</span></p>))}
                      </>)}
                    </div>
                  </div>
                </div>

                {caps.map((c) => {
                  const lista = pats.filter((x) => x.cap === c.id);
                  if (!lista.length) return null;
                  return (
                    <div key={c.id} style={{ marginBottom: '14px' }}>
                      <div style={{ display: 'flex', alignItems: 'baseline', gap: '10px', margin: '0 4px 8px' }}>
                        <span style={{ fontFamily: 'Sora,Inter', fontWeight: 800, fontSize: '20px', color: '#e9c46a' }}>{c.id}</span>
                        <span style={{ fontWeight: 800 }}>{c.titulo}</span>
                        <span className="eyebrow" style={{ marginLeft: 'auto' }}>{etiquetaNivel(nivelDe(c.id))}</span>
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(210px,1fr))', gap: '8px' }}>
                        {lista.map((x) => (
                          <button key={x.id} onClick={() => cambiar(x.id)} className={`chip ${x.id === p.id ? 'chip-active' : ''}`}
                            style={{ textAlign: 'left', padding: '10px 12px', borderRadius: '14px' }}>
                            <span style={{ display: 'block', fontSize: '11px', fontWeight: 800, letterSpacing: '.08em', color: '#e9c46a' }}>{x.id} · {x.genero.toUpperCase()}</span>
                            <span style={{ display: 'block', fontWeight: 700, fontSize: '14px', color: 'var(--txt)' }}>{x.nombre}</span>
                            <span style={{ display: 'block', fontSize: '12px', color: 'var(--muted)' }}>{x.compas}{x.swing ? ' swing' : ''} · {x.bpm[0]}–{x.bpm[2]} BPM</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
              <Footer />
            </div>
          );
        };

        /* PRESETS-JSX:FIN */
        const StrummingPatternApp = () => {
          // 0 = menú de niveles, 1 = configuración, 2 = ejercicio, 3 = ritmos del método (presets).
          // Un enlace con ?preset=ID (los del PDF del método) abre directo en la pantalla 3. [2026-10-04]
          const [screen, setScreen] = useState(() => {
            try { return new URLSearchParams(location.search).get('preset') ? 3 : 0; } catch (e) { return 0; }
          });
          const [level, setLevel] = useState(1);    // 1 = rasgueo básico (corcheas), 2 = funk (16vos)
          const [config, setConfig] = useState({
            title: '',
            showTitle: true,
            numBars: 1,
            chordsPerBar: 2,   // fijo: 2 acordes por compás
            bpm: 80,
            allDownstrokes: false,
            showCount: false   // nivel 2: muestra el conteo silábico bajo las flechas
          });

          const [bars, setBars] = useState([]);
          const [isPlaying, setIsPlaying] = useState(false);
          // el generador "Crear Ritmo" incluye flechas muteadas (×) cuando está activo
          const [includeMuted, setIncludeMuted] = useState(false);
          const [rasgueoEnabled, setRasgueoEnabled] = useState(false);
          // número de la precuenta que se muestra sobre la pantalla (0 = sin precuenta activa)
          const [countIn, setCountIn] = useState(0);
          // BPM como texto editable: permite borrar y reescribir en móvil sin que salte a 80
          const [bpmText, setBpmText] = useState(String(config.bpm));
          useEffect(() => { setBpmText(String(config.bpm)); }, [config.bpm]);
          const onBpmChange = (e) => {
            const v = e.target.value;
            if (/^\d{0,3}$/.test(v)) {        // solo dígitos, hasta 3
              setBpmText(v);
              const n = parseInt(v, 10);
              if (!isNaN(n) && n >= 40 && n <= 240) setConfig((c) => ({ ...c, bpm: n }));
            }
          };
          const onBpmBlur = () => {
            let n = parseInt(bpmText, 10);
            if (isNaN(n)) n = config.bpm;
            n = Math.min(240, Math.max(40, n));
            setConfig((c) => ({ ...c, bpm: n }));
            setBpmText(String(n));
          };
          // detecta pantalla angosta (móvil) para apilar cada compás en su propia línea
          const [isMobile, setIsMobile] = useState(typeof window !== 'undefined' ? window.innerWidth < 760 : false);
          useEffect(() => {
            const onResize = () => setIsMobile(window.innerWidth < 760);
            window.addEventListener('resize', onResize);
            return () => window.removeEventListener('resize', onResize);
          }, []);
          const intervalRef = useRef(null);
          const audioContextRef = useRef(null);
          const exportRef = useRef(null);
          // refs para resaltar la flecha en curso SIN re-render (evita el thrashing que bloqueaba los botones)
          const arrowRefs = useRef({});
          const currentKeyRef = useRef(null);
          // refs vivos para que el scheduler de audio lea SIEMPRE el valor actual (evita stale closures
          // y permite encender el rasgueo durante la reproducción — punto 2)
          const rasgueoRef = useRef(rasgueoEnabled);
          const barsRef = useRef(bars);
          useEffect(() => { rasgueoRef.current = rasgueoEnabled; }, [rasgueoEnabled]);
          useEffect(() => { barsRef.current = bars; }, [bars]);

          // subdivisiones por compás según el nivel: nivel 1 = 8 (corcheas), nivel 2 = 16 (semicorcheas)
          const stepsPerBar = level === 2 ? 16 : 8;

          const highlightArrow = (bar, arrow) => {
            const prev = currentKeyRef.current;
            if (prev && arrowRefs.current[prev]) arrowRefs.current[prev].classList.remove('arrow-current');
            if (bar < 0) { currentKeyRef.current = null; return; }
            const key = `${bar}_${arrow}`;
            const el = arrowRefs.current[key];
            if (el) {
              el.classList.add('arrow-current');
              el.classList.remove('arrow-beat'); void el.offsetWidth; el.classList.add('arrow-beat');
            }
            currentKeyRef.current = key;
          };

          useEffect(() => {
            if (screen === 2) {
              const mismatch = bars.length !== config.numBars
                || (bars[0] && bars[0].arrows.length !== stepsPerBar);
              if (bars.length === 0 || mismatch) initializeBars();
            }
          }, [screen]);

          const initializeBars = () => {
            const newBars = Array(config.numBars).fill(null).map(() => ({
              chords: Array(config.chordsPerBar).fill(0).map(() => ({ value: '', position: 0 })),
              arrows: Array(stepsPerBar).fill(0)
            }));
            setBars(newBars);
          };

          const getChordPositions = () => {
            // 2 acordes por compás, repartidos a lo ancho del compás
            const half = Math.floor(stepsPerBar / 2);
            return [0, half];
          };

          const handleContinue = () => {
            if (config.numBars) setScreen(2);
          };

          const toggleArrow = (barIndex, arrowIndex) => {
            const newBars = bars.map((b, i) => i === barIndex
              ? { ...b, arrows: b.arrows.map((a, j) => j === arrowIndex ? (a + 1) % 3 : a) }
              : b);
            setBars(newBars);
          };

          /* ---------- Crear Ritmo: flechas al azar ----------
             - Nivel 1 (o funk sin muteados): mezcla de vacías y azules.
             - Funk (nivel 2) con "Muteados": el compás se llena por completo; cada posición
               es azul o morada (×). No quedan posiciones vacías. */
          const generateRandomRhythm = () => {
            const funkMuted = level === 2 && includeMuted;
            const newBars = bars.map((b) => ({
              ...b,
              arrows: b.arrows.map(() => {
                if (funkMuted) {
                  // todas activas: azul o morada
                  return Math.random() < 0.5 ? 1 : 2;
                }
                if (Math.random() >= 0.55) return 0;             // vacía
                if (includeMuted && Math.random() < 0.3) return 2; // muteada (×)
                return 1;                                          // azul
              })
            }));
            setBars(newBars);
          };

          /* ---------- Limpiar flechas: regresa a estado inicial ---------- */
          const clearArrows = () => {
            const newBars = bars.map((b) => ({ ...b, arrows: Array(stepsPerBar).fill(0) }));
            setBars(newBars);
          };

          /* ---------- 4) Acorde: en blanco, hover para escribir, 1ra letra mayúscula ---------- */
          const setChord = (barIndex, chordIndex, rawValue) => {
            const positions = getChordPositions();
            const value = capFirst(rawValue.trim());
            const newBars = bars.map((b, i) => i === barIndex
              ? { ...b, chords: b.chords.map((c, j) => j === chordIndex
                  ? { value: value, position: positions[chordIndex] } : c) }
              : b);
            setBars(newBars);
          };

          /* ---------- Audio: scheduler basado en el reloj de Web Audio (sin deriva) ---------- */
          // Técnica "A Tale of Two Clocks": un único lookahead scheduler agenda cada evento
          // con timestamp exacto del AudioContext. Las flechas visuales se sincronizan a esos
          // mismos timestamps. Esto elimina la desincronización que aparecía con setInterval.

          const makeClick = (ctx, time, isDownbeat) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.frequency.value = isDownbeat ? 800 * Math.pow(2, 4 / 12) : 800;
            osc.type = 'square';
            g.gain.setValueAtTime(0.3, time);
            g.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
            osc.start(time); osc.stop(time + 0.1);
          };

          // Bombo / kick para las flechas AZULES: grave y redondo, contrasta con el clic agudo del metrónomo
          const makeKick = (ctx, time) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, time);
            osc.frequency.exponentialRampToValueAtTime(40, time + 0.12);
            g.gain.setValueAtTime(0.0001, time);
            g.gain.exponentialRampToValueAtTime(0.95, time + 0.006);
            g.gain.exponentialRampToValueAtTime(0.0001, time + 0.26);
            osc.connect(g); g.connect(ctx.destination);
            osc.start(time); osc.stop(time + 0.28);
          };

          // Hi-hat cerrado para los MUTEADOS (×): "ts" corto y agudo, ruido pasa-altos
          const makeHat = (ctx, time) => {
            const dur = 0.05;
            const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            const noise = ctx.createBufferSource(); noise.buffer = buffer;
            const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 8000;
            const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 10000; bp.Q.value = 0.8;
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.5, time);
            g.gain.exponentialRampToValueAtTime(0.001, time + 0.045);
            noise.connect(hp); hp.connect(bp); bp.connect(g); g.connect(ctx.destination);
            noise.start(time); noise.stop(time + dur);
          };

          const playMetronome = () => {
            if (!audioContextRef.current) {
              audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
            }
            const ctx = audioContextRef.current;
            if (ctx.state === 'suspended') ctx.resume();

            const steps = stepsPerBar;                 // 8 (nivel 1) o 16 (nivel 2)
            const numBars = config.numBars;
            const beatMs = 60000 / config.bpm;          // duración de una negra
            const stepDur = (beatMs / (steps / 4)) / 1000; // duración de cada subdivisión, en segundos
